name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need a build or a release.
    paths-ignore: ['docs/**', '**.md']
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # Linux runners have no display, so Swing tests run on a virtual one.
      - name: Check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run ./gradlew check
      - name: Check
        if: runner.os != 'Linux'
        run: ./gradlew check

  lint:
    name: Lint workflows, scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans every commit, not just the latest.
          fetch-depth: 0
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on pull requests would need write access; the job log is enough.
          GITLEAKS_ENABLE_COMMENTS: false

  # Every push to main that passes the checks becomes a signed release.
  # See docs/decisions/0008-signed-releases.md, 0009-key-rotation.md and 0011-version-numbers.md.
  release:
    name: Release
    needs: [check, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is the commit count, which needs the full history.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: echo "VERSION=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:jar :signing:installDist -PreleaseVersion="$VERSION"

      # Signs the manifest and checks it against trust/keys.json, so a key apps don't trust fails here.
      - name: Sign
        env:
          PHOENIXNOTES_SIGNING_KEY: ${{ secrets.PHOENIXNOTES_SIGNING_KEY }}
        run: >-
          signing/build/install/signing/bin/signing release "app/build/libs/app-$VERSION.jar"
          --version "$VERSION"
          --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/app-$VERSION.jar"
          --keys trust/keys.json
          --out release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION"
          "app/build/libs/app-$VERSION.jar" release/manifest.json release/manifest.json.sig trust/keys.json
          --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

  # Each OS builds its own installer, with its own Java runtime, and adds it to the release.
  # See docs/decisions/0017-installers.md.
  installers:
    name: Installer (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      # jpackage builds .msi files with WiX, and .deb files with fakeroot.
      - name: Packaging tools (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot

      - name: Build
        shell: bash
        run: |
          VERSION="1.0.$(git rev-list --count HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew :app:installer -PreleaseVersion="$VERSION"

      # Release assets, not workflow artifacts, so they don't use up Actions storage.
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" app/build/installer/*

